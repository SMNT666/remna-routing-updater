services:
  routing-updater:
    build:
      context: .
    image: ghcr.io/smnt666/remna-routing-updater:latest
    container_name: remna-routing-updater
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${ROUTING_ASSETS_DIR}:${ROUTING_ASSETS_DIR}
    networks:
      - remnawave-network

networks:
  remnawave-network:
    name: remnawave-network
    external: true
